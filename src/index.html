<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chess</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">

    <script defer type="module" src="js/main.js"></script>
    <script defer type="module" src="js/constantas.js"></script>
    <script defer type="module" src="js/moves.js"></script>
    <script defer type="module" src="js/fen.js"></script>
    <script defer type="module" src="js/stockfish.js"></script>
</head>
<body>    
    <div class="wrapper">
        <div class="turn"></div>
        <div class="chessboard-wrapper">
            <div class="letters top">
                <span>a</span>
                <span>b</span>
                <span>c</span>
                <span>d</span>
                <span>e</span>
                <span>f</span>
                <span>g</span>
                <span>h</span>
            </div>

            <div class="numbers left">
                <span>8</span>
                <span>7</span>
                <span>6</span>
                <span>5</span>
                <span>4</span>
                <span>3</span>
                <span>2</span>
                <span>1</span>
            </div>

            <div class="chessboard"></div>

            <div class="numbers right">
                <span>8</span>
                <span>7</span>
                <span>6</span>
                <span>5</span>
                <span>4</span>
                <span>3</span>
                <span>2</span>
                <span>1</span>
            </div>

            <div class="letters bottom">
                <span>a</span>
                <span>b</span>
                <span>c</span>
                <span>d</span>
                <span>e</span>
                <span>f</span>
                <span>g</span>
                <span>h</span>
            </div>
        </div>
    </div>

</body>
</html>
